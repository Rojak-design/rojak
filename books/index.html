<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Books · Rojak</title>
  <meta name="description" content="Books you want to read, are reading and have finished. Data stays on your phone.">
  <meta name="theme-color" content="#8a4b1f">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../rojak-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../rojak-apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Books">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- When app files change, bump ?v= here, in index.html, money/index.html, fitness/index.html, habits/index.html and the version in sw.js (keep them all the same). -->
  <link rel="stylesheet" href="style.css?v=94">
</head>
<body>
  <header class="topbar">
    <a href="../" class="back-home">‹ Rojak</a>
    <h1>Books</h1>
    <div id="summaryLine" class="muted small"></div>
  </header>

  <main>
    <div id="books"></div>
  </main>

  <button id="fab" class="fab" aria-label="Add a book">+</button>

  <!-- Bottom sheet for search and forms -->
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- Finished a book: when, and how many stars (over the sheet) -->
  <div id="finishDlg" class="dlg hidden" role="dialog" aria-modal="true" aria-labelledby="finishTitle">
    <div class="sheet-backdrop" data-fclose></div>
    <div class="dlg-panel">
      <div class="dlg-cover" id="finishCover"></div>
      <h2 id="finishTitle">Finished! 🎉</h2>
      <div class="muted small" id="finishBook"></div>
      <label>Finished on <input type="date" id="finishDate"></label>
      <div class="label-t">How was it?</div>
      <div class="stars big" id="finishStars" role="radiogroup" aria-label="Rating"></div>
      <div class="star-word" id="finishWord"></div>
      <div class="warn-line hidden" id="finishWarn"></div>
      <button class="btn" type="button" id="finishOk">Save</button>
      <button class="link-btn" type="button" data-fclose>Cancel</button>
    </div>
  </div>

  <!-- Edit the genre list (over the sheet) -->
  <div id="genreDlg" class="dlg genre-dlg hidden" role="dialog" aria-modal="true" aria-labelledby="genreTitle">
    <div class="sheet-backdrop" data-gclose></div>
    <div class="dlg-panel">
      <h2 id="genreTitle">Genres</h2>
      <div class="muted small">Rename a genre by typing over it. Removing one takes it off its books (the number is how many books have it).</div>
      <div id="genreList" class="genre-list"></div>
      <form id="genreAdd" class="genre-add"><input id="genreNew" maxlength="30" placeholder="New genre, e.g. Horror" aria-label="New genre"><button class="btn" type="submit">Add</button></form>
      <button class="btn secondary" type="button" data-gclose>Done</button>
    </div>
  </div>

  <input type="file" id="coverFile" accept="image/*" hidden>
  <input type="file" id="coverCamera" accept="image/*" capture="environment" hidden>

  <div id="toast" class="toast hidden"></div>

  <script src="../core/store.js?v=94"></script>
  <script src="genres.js?v=94"></script>
  <script src="app.js?v=94"></script>
</body>
</html>
